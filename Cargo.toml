[package]
name = "spool"
version = "0.1.0"
edition = "2024"
description = "A distributed task queue: own broker, leases with fencing tokens, Raft replication, deterministic simulation"
license = "MIT"

[dependencies]
crc32c = "0.6"
thiserror = "2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
